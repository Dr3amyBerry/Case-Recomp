name: Python static analysis CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test and media validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete source-only test suite with coverage
        run: |
          python -m coverage run --source=caserecomp -m unittest discover -s tests -q
          python -m coverage report -m --fail-under=90
      - name: Compile all Python sources
        run: python -m compileall -q caserecomp tests
