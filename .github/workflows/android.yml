name: Android synthetic shell CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and test synthetic Android shell
        working-directory: android
        run: gradle --no-daemon :engine:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
