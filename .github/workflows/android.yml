name: Android synthetic/private-content shell CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify hosted Android SDK
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Build, unit-test and run deterministic performance guardrails
        working-directory: android
        run: gradle --no-daemon :engine:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug

  package-debug:
    name: reproducible synthetic debug artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify CI holds no release signing key
        working-directory: android
        shell: bash
        run: |
          # Release APKs are built and signed only on the tester's PC (private/signing, git-ignored).
          if [ -e ../private/signing/release.properties ]; then
            echo "release signing material must never be in the repository or CI" >&2
            exit 1
          fi
      - name: Build baseline, candidate twice, and generate evidence
        shell: bash
        run: |
          cd android
          gradle --no-daemon clean :app:assembleDebug -Pphase8VersionCode=7
          cp app/build/outputs/apk/debug/app-debug.apk ../phase8-baseline.apk
          gradle --no-daemon clean :app:assembleDebug -Pphase8VersionCode=8
          FIRST="$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')"
          gradle --no-daemon clean :app:assembleDebug -Pphase8VersionCode=8
          cd ..
          COMMIT_TS="$(git show -s --format=%cI HEAD)"
          python tools/phase8_evidence.py             --apk android/app/build/outputs/apk/debug/app-debug.apk             --baseline-apk phase8-baseline.apk             --output phase8-artifact             --git-sha "$GITHUB_SHA"             --commit-timestamp "$COMMIT_TS"             --first-build-sha "$FIRST"
      - name: Upload synthetic debug evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case-recomp-phase8-synthetic-debug-${{ github.sha }}
          path: phase8-artifact
          if-no-files-found: error
          retention-days: 14

  instrumented:
    name: instrumented (API ${{ matrix.api-level }})
    needs: package-debug
    runs-on: ubuntu-latest
    env:
      PHASE8_API: ${{ matrix.api-level }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: case-recomp-phase8-synthetic-debug-${{ github.sha }}
          path: phase8-download
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented and external lifecycle QA
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          working-directory: ./android
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ../tools/phase8_emulator_qa.sh "$PHASE8_API"
      - name: Print synthetic instrumentation test failures
        if: failure()
        shell: bash
        working-directory: ./android
        run: |
          echo "Only synthetic test failure summaries; no private game content is used in CI."
          find app/build/outputs/androidTest-results/connected -type f -name '*.xml' -print -exec grep -nE '<failure|<error|<testsuite' {} \; 2>/dev/null | head -n 160 || true
      - name: Upload API 26 external runtime metrics
        if: matrix.api-level == 26 && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case-recomp-phase8-runtime-metrics-${{ github.sha }}
          path: phase8-runtime
          if-no-files-found: warn
          retention-days: 14
