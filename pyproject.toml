[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caserecomp-static"
version = "0.8.0"
description = "Local and offline static Director/Afterburner game asset research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Case-Recomp contributors"}]
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=11.3,<13"]
media = ["Pillow>=11.3,<13", "mutagen>=1.47,<2"]
font-research = ["Pillow>=11.3,<13", "fonttools>=4.61,<5", "matplotlib>=3.9,<4"]
dev = ["Pillow>=11.3,<13", "mutagen>=1.47,<2", "coverage>=7.5,<8", "fonttools>=4.61,<5"]

[project.scripts]
caserecomp = "caserecomp.__main__:main"

[tool.setuptools.packages.find]
include = ["caserecomp*"]
