<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Case Recomp simple app icon</title>
  <desc id="desc">A simplified mystery-style icon with a gold magnifying glass and the text Case Recomp.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173764"/>
      <stop offset="60%" stop-color="#10284a"/>
      <stop offset="100%" stop-color="#1d1430"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2b6"/>
      <stop offset="18%" stop-color="#f6d773"/>
      <stop offset="45%" stop-color="#d29b29"/>
      <stop offset="72%" stop-color="#ffde8b"/>
      <stop offset="100%" stop-color="#a46715"/>
    </linearGradient>
    <radialGradient id="lens" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8f8ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#b7def6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4b76a6" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="180" fill="none" stroke="url(#gold)" stroke-width="20" opacity="0.95"/>
  <rect x="82" y="82" width="860" height="860" rx="164" fill="none" stroke="#f7e5b6" stroke-opacity="0.26" stroke-width="4"/>

  <g filter="url(#shadow)">
    <circle cx="512" cy="410" r="210" fill="#0f2545" fill-opacity="0.55"/>
  </g>

  <g transform="translate(0,0)" filter="url(#shadow)">
    <circle cx="470" cy="380" r="164" fill="url(#lens)" stroke="url(#gold)" stroke-width="30"/>
    <circle cx="470" cy="380" r="124" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
    <path d="M580 490 L700 610" stroke="url(#gold)" stroke-width="34" stroke-linecap="round"/>
    <path d="M694 604 L785 695" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
    <path d="M392 288c24-18 56-30 92-33" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <text x="512" y="800" text-anchor="middle" font-size="102" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="url(#gold)" letter-spacing="2">CASE RECOMP</text>
  </g>
</svg>
