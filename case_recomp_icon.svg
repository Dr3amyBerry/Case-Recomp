<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Case Recomp app icon</title>
  <desc id="desc">Original mystery-themed app icon for Case Recomp featuring a magnifying glass, jewel, and CR monogram.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13233f"/>
      <stop offset="55%" stop-color="#1d3257"/>
      <stop offset="100%" stop-color="#2c1734"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#b7d1ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0ba"/>
      <stop offset="22%" stop-color="#f2c862"/>
      <stop offset="50%" stop-color="#c58b24"/>
      <stop offset="76%" stop-color="#f4d98b"/>
      <stop offset="100%" stop-color="#9b6517"/>
    </linearGradient>
    <linearGradient id="glassMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf6cf"/>
      <stop offset="35%" stop-color="#dbb85b"/>
      <stop offset="65%" stop-color="#9c6a1f"/>
      <stop offset="100%" stop-color="#f5e39c"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#dff5ff" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#a8d7f5" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#5f8ab6" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="rubyGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd6e3"/>
      <stop offset="30%" stop-color="#ff6b8b"/>
      <stop offset="68%" stop-color="#c81d4b"/>
      <stop offset="100%" stop-color="#78122d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="214" fill="url(#bgGrad)"/>
  <rect x="36" y="36" width="952" height="952" rx="214" fill="url(#glowGrad)"/>

  <!-- Decorative frame -->
  <rect x="84" y="84" width="856" height="856" rx="174" fill="none" stroke="url(#goldGrad)" stroke-width="24"/>
  <rect x="110" y="110" width="804" height="804" rx="150" fill="none" stroke="#f6deb0" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Corner ornaments -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M150 246c18-42 52-76 94-94"/>
    <path d="M246 150c-7 28-26 47-58 58"/>
    <path d="M874 246c-18-42-52-76-94-94"/>
    <path d="M778 150c7 28 26 47 58 58"/>
    <path d="M150 778c18 42 52 76 94 94"/>
    <path d="M246 874c-7-28-26-47-58-58"/>
    <path d="M874 778c-18 42-52 76-94 94"/>
    <path d="M778 874c7-28 26-47 58-58"/>
  </g>

  <!-- Main medallion -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="470" r="254" fill="#10213b" fill-opacity="0.52"/>
    <circle cx="512" cy="470" r="238" fill="none" stroke="#e7c36a" stroke-opacity="0.42" stroke-width="4"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(0 8)">
    <circle cx="470" cy="430" r="170" fill="url(#lensGrad)" stroke="url(#glassMetal)" stroke-width="28" filter="url(#shadow)"/>
    <circle cx="470" cy="430" r="128" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
    <path d="M585 545 L695 655" stroke="url(#glassMetal)" stroke-width="42" stroke-linecap="round"/>
    <path d="M695 655 L770 730" stroke="#694012" stroke-opacity="0.55" stroke-width="54" stroke-linecap="round"/>
    <path d="M689 649 L763 723" stroke="url(#glassMetal)" stroke-width="30" stroke-linecap="round"/>
    <path d="M390 325c28-22 66-37 108-41" stroke="#ffffff" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Jewel clue -->
  <g filter="url(#softGlow)">
    <path d="M612 500l54 54-54 78-54-78z" fill="url(#rubyGrad)" stroke="#ffd6e3" stroke-opacity="0.55" stroke-width="4"/>
    <path d="M612 500l-54 54h108z" fill="#ffafc2" fill-opacity="0.34"/>
  </g>

  <!-- CR monogram -->
  <g transform="translate(0 2)">
    <path d="M350 444c0-82 57-138 137-138 41 0 79 15 106 42l-37 43c-20-19-42-28-68-28-45 0-77 31-77 81 0 51 31 82 76 82 31 0 55-11 76-35l39 40c-29 34-68 52-118 52-78 0-134-55-134-139z"
          fill="url(#goldGrad)" stroke="#5a3a10" stroke-opacity="0.25" stroke-width="5"/>
    <path d="M462 648c-16 0-29-13-29-29V497c0-16 13-29 29-29h112c37 0 62-19 62-51 0-30-23-47-61-47h-113v-57h118c71 0 119 39 119 100 0 44-23 76-63 92l74 114h-70l-66-102h-54v102c0 16-13 29-29 29h-29z"
          fill="url(#goldGrad)" stroke="#5a3a10" stroke-opacity="0.25" stroke-width="5"/>
  </g>

  <!-- Bottom name strip -->
  <g filter="url(#shadow)">
    <rect x="216" y="752" width="592" height="112" rx="56" fill="#101b31" fill-opacity="0.82" stroke="url(#goldGrad)" stroke-width="8"/>
    <text x="512" y="802" text-anchor="middle" font-size="72" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#f7e6ba" letter-spacing="3">CASE RECOMP</text>
    <text x="512" y="837" text-anchor="middle" font-size="28" font-weight="600" font-family="Georgia, 'Times New Roman', serif" fill="#d7b870" letter-spacing="5">MYSTERY ENGINE</text>
  </g>
</svg>
